name: Project documentation and source checks
on:
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate documentation
        run: |
          python - <<'PY'
          from pathlib import Path
          import re,urllib.parse
          s=Path("docs/PROJECT_GUIDE.md").read_text()
          assert s.count("~~~")%2==0 and s.count("~~~mermaid")>=3
          assert "docs/PROJECT_GUIDE.md" in Path("README.md").read_text(encoding="utf-8-sig")
          for t in re.findall(r"\]\(([^)]+)\)",s):
           target=t.split("#")[0].split("?")[0]
           if target and not target.startswith(("https://","http://","#")): assert (Path("docs")/urllib.parse.unquote(target)).exists(),target
          print("README links and Mermaid passed")
          PY

  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: NuGet/setup-nuget@v2
      - uses: microsoft/setup-msbuild@v2
      - run: nuget restore InvoiceSystem.sln -NonInteractive
      - name: Build source
        shell: pwsh
        run: msbuild InvoiceSystem.sln /m /p:Configuration=Release '/p:Platform=Any CPU'
